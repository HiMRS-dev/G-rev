name: Deploy to Windows IIS

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: guitarLending-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: 144.31.73.240
      DEPLOY_USER: Administrator
      DEPLOY_PORT: "22"
      DEPLOY_KNOWN_HOSTS: "144.31.73.240 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAgfUlevcin2OLG9zQLxW1/rSmGpoWOp8m32Bp/LmYGE"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment settings
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEPLOY_HOST}"
          test -n "${DEPLOY_USER}"
          test -n "${DEPLOY_PORT}"
          test -n "${SSH_PRIVATE_KEY}"
          test -n "${DEPLOY_KNOWN_HOSTS}"
          case "${DEPLOY_HOST}" in
            144.31.73.240|guitar-revolution.ru) ;;
            *) echo "DEPLOY_HOST is not an approved production host" >&2; exit 1 ;;
          esac

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Build public site archive
        run: |
          set -euo pipefail
          git archive --format=zip --output=site.zip HEAD -- \
            '*.html' \
            App_Code \
            web.config \
            style.css \
            script.js \
            images \
            favicon \
            robots.txt \
            sitemap.xml
          unzip -tq site.zip
          test -s site.zip

      - name: Upload release archive
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_PORT}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            site.zip \
            "${DEPLOY_USER}@${DEPLOY_HOST}:C:/Users/Administrator/guitarLending-deploy-${GITHUB_SHA}.zip"

      - name: Activate IIS release
        run: |
          set -euo pipefail
          python3 - <<'PY' > remote-script.txt
          import base64
          script = r'''
          $ErrorActionPreference = "Stop"
          Import-Module WebAdministration
          $archive = "C:\Users\Administrator\guitarLending-deploy-${GITHUB_SHA}.zip"
          $release = "C:\Sites\guitarLending\releases\${GITHUB_SHA}"
          New-Item -ItemType Directory -Path $release -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $release -Force
          $site = Get-Website -Name "guitarLending" -ErrorAction SilentlyContinue
          if (-not $site) {
            New-Website -Name "guitarLending" -PhysicalPath $release -Port 80 -IPAddress "*" -Force | Out-Null
          } else {
            Set-ItemProperty "IIS:\Sites\guitarLending" -Name physicalPath -Value $release
          }
          Start-Website -Name "guitarLending"
          if (-not (Test-Path -LiteralPath (Join-Path $release "index.html"))) { throw "index.html is missing" }
          if (-not (Test-Path -LiteralPath (Join-Path $release "web.config"))) { throw "web.config is missing" }
          Write-Output "IIS release activated: ${GITHUB_SHA}"
          '''
          print(base64.b64encode(script.encode('utf-16le')).decode())
          PY
          ENCODED_SCRIPT="$(cat remote-script.txt)"
          ssh -p "${DEPLOY_PORT}" \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "powershell -NoProfile -NonInteractive -EncodedCommand ${ENCODED_SCRIPT}"

      - name: Validate production HTTP endpoints
        env:
          BASE_URL: http://144.31.73.240
        run: |
          set -euo pipefail
          CURL_HOST=(-H 'Host: guitar-revolution.ru')
          test "$(curl -sS "${CURL_HOST[@]}" -o /dev/null -w '%{http_code}' "${BASE_URL}/")" = 200
          test "$(curl -sS "${CURL_HOST[@]}" -o /dev/null -w '%{http_code}' "${BASE_URL}/robots.txt")" = 200
          test "$(curl -sS "${CURL_HOST[@]}" -o /dev/null -w '%{http_code}' "${BASE_URL}/sitemap.xml")" = 200
          test "$(curl -sS "${CURL_HOST[@]}" -o /dev/null -w '%{http_code}' "${BASE_URL}/privacy/")" = 200
          grep -Fq '<link rel="canonical" href="https://guitar-revolution.ru/">' <(curl -fsSL "${CURL_HOST[@]}" "${BASE_URL}/")
